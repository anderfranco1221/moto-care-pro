services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: '1234'
      POSTGRES_DB: moto-pro
    ports:
      - '5433:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d moto-pro']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://admin:1234@db:5432/moto-pro
      # Interim single-schema placeholder (see src/prisma/tenant-prisma.service.ts)
      # until Fase 2's PrismaClientManager provisions/routes real per-tenant
      # schemas. TENANT_SCHEMA_NAME must exist before /motorcycles works —
      # it is NOT auto-created by docker-entrypoint.sh yet (deferred to the
      # migrate-tenants provisioning task).
      TENANT_DATABASE_URL: postgresql://admin:1234@db:5432/moto-pro
      TENANT_SCHEMA_NAME: tenant_dev
      PORT: 3001
      HEALTH_CHECK_ENABLED: 'true'
    ports:
      - '3001:3001'

volumes:
  db_data:
